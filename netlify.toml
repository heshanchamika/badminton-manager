[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Tell Netlify's secret scanner to allow Firebase public client keys in the build bundle
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_PROJECT_ID"
